# Dev-only. docker-compose.yml doesn't actually define a mysql service —
# DB_URL/DB_USERNAME/DB_PASSWORD come from a gitignored application-secrets.yaml
# locally. This Secret is that missing piece, reconstructed for a self-contained
# in-cluster stack. Swap for `kubectl create secret` / a real secrets manager
# before this touches anything that isn't throwaway.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: echo
type: Opaque
stringData:
  MYSQL_DATABASE: echo
  MYSQL_USER: echo
  MYSQL_PASSWORD: echo
  MYSQL_ROOT_PASSWORD: root
